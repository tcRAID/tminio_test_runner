name: System test harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: suite/requirements-release.txt
      - run: python -m pip install -r suite/requirements-release.txt
      - run: ./run.sh unit --artifacts test-reports/harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-python-${{ matrix.python }}
          path: test-reports/harness/
